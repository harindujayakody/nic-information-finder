<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIC Information Finder</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.6.4.min.js" integrity="sha256-oP6HI9z1XaZNBrJURtCoUT5SUnxFr8s3BzRl+cbzUq8=" crossorigin="anonymous"></script>
    <script src="script.js" defer></script>
    <link rel="shortcut icon" type="image/jpg" href="/nic-information-finder/img/favicon.ico"/>

    <!-- SEO Meta Tags -->
    <meta name="description" content="Sri Lankan National Identity Card (NIC) information finder. Decode birth year, date of birth, gender, and age.">
    <meta name="keywords" content="Sri Lanka, NIC, National Identity Card, NIC Decoder, Birthday, Age, Gender">
    <meta name="author" content="Harindu Jayakody">

    <!-- Open Graph Meta Tags (for social media sharing) -->
    <meta property="og:title" content="NIC Information Finder">
    <meta property="og:description" content="Decode birthday, gender, and age from old and new Sri Lankan NIC numbers.">
    <meta property="og:type" content="website">

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="NIC Information Finder">
    <meta name="twitter:description" content="Decode birthday, gender, and age from old and new Sri Lankan NIC numbers.">
</head>
<body>

    <div class="container">
        <h2>NIC Information Finder</h2>
        <form>
            <label for="nic">Enter NIC Number:</label>
            <input type="text" id="nic" placeholder="e.g. 931234567V or 199312345678" maxlength="12" required>
            <div class="button-group">
                <button type="button" id="find">Find Information</button>
                <button type="reset">Reset</button>
            </div>
        </form>

        <div id="result">
            <p id="error"></p>
            <p><strong>Gender:</strong> <span id="gender"></span></p>
            <p><strong>Date of Birth:</strong> <span id="dob"></span></p>
            <p><strong>Age:</strong> <span id="age"></span></p>
        </div>
    </div>
</body>
</html>
