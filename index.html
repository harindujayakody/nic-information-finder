<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIC Information Finder</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.6.4.min.js" integrity="sha256-oP6HI9z1XaZNBrJURtCoUT5SUnxFr8s3BzRl+cbzUq8=" crossorigin="anonymous"></script>
    <script src="script.js" defer></script>
    <link rel="shortcut icon" type="image/jpg" href="/nic-information-finder/img/favicon.ico"/>

    <!-- SEO: this copy is noindex; the maintained version lives on harindujayakody.com -->
    <meta name="description" content="Find the date of birth, age and gender from a Sri Lankan NIC number (old 9-digit V/X or new 12-digit format).">
    <meta name="author" content="Harindu Jayakody">
    <link rel="canonical" href="https://harindujayakody.com/free-tools/sri-lanka-nic-decoder/">

    <meta name="robots" content="noindex" />
    
</head>
<body>

    <div class="container">
        <h2>NIC Information Finder</h2>
        <form>
            <label for="nic">Enter NIC Number:</label>
            <input type="text" id="nic" placeholder="Enter NIC number..." maxlength="12" required>
            <div class="button-group">
                <button type="button" id="find">Find Information</button>
                <button type="reset">Reset</button>
            </div>
        </form>
        <p class="moved">A newer version with old/new conversion lives at <a href="https://harindujayakody.com/free-tools/sri-lanka-nic-decoder/">harindujayakody.com/free-tools/sri-lanka-nic-decoder</a>.</p>

        <div id="result">
            <p id="error"></p>
            <p><strong>Gender:</strong> <span id="gender"></span></p>
            <p><strong>Date of Birth:</strong> <span id="dob"></span></p>
            <p><strong>Age:</strong> <span id="age"></span></p>
        </div>
    </div>
</body>
</html>
